<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Take survey | Survey Pad</title>
    <meta content="Answer a survey and submit your response." name="description">
    <meta content="#4f46e5" name="theme-color">
    <link href="favicon.ico" rel="icon" sizes="48x48">
    <link href="assets/favicon/favicon.svg" rel="icon" type="image/svg+xml">
    <link href="assets/favicon/favicon-32.png" rel="icon" sizes="32x32" type="image/png">
    <link href="assets/favicon/favicon-16.png" rel="icon" sizes="16x16" type="image/png">
    <link href="assets/favicon/apple-touch-icon.png" rel="apple-touch-icon">
    <link href="site.webmanifest" rel="manifest">
    <meta content="website" property="og:type">
    <meta content="Survey Pad" property="og:site_name">
    <meta content="Take survey | Survey Pad" property="og:title">
    <meta content="Answer a survey and submit your response." property="og:description">
    <meta content="assets/og/og-image.png" property="og:image">
    <meta content="image/png" property="og:image:type">
    <meta content="1200" property="og:image:width">
    <meta content="630" property="og:image:height">
    <meta content="Survey Pad logo and tagline on a purple gradient" property="og:image:alt">
    <meta content="summary_large_image" name="twitter:card">
    <meta content="Take survey | Survey Pad" name="twitter:title">
    <meta content="Answer a survey and submit your response." name="twitter:description">
    <meta content="assets/og/og-image.png" name="twitter:image">
    <meta content="Survey Pad logo and tagline on a purple gradient" name="twitter:image:alt">
    <link href="assets/css/index.css" rel="stylesheet">

    <script>
        try {
            var s = JSON.parse(localStorage.getItem('sp:theme'));
            var t = s && s.theme;
            if (!t) t = matchMedia('(prefers-contrast: more)').matches ? 'contrast'
                : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.dataset.theme = t;
        } catch (e) {
        }
    </script>
</head>
<body data-page="take" data-route="take">
<header class="app-header">
    <a class="app-brand" href="index.html">
        <span class="brand-dot"></span>
        Survey Pad
    </a>
    <button aria-label="Theming" class="icon-button" id="theme-btn" type="button">
        <img alt="" class="icon" height="18" src="assets/icons/png/settings.png" width="18">
    </button>
</header>

<main class="app-main">
    <div class="empty-state" hidden id="take-not-found">
        <p id="take-not-found-message">No survey found.</p>
        <a class="btn btn--ghost" href="index.html">Back to surveys</a>
    </div>

    <div hidden id="take-content">
        <article class="survey-take-card">
            <header class="survey-take-details">
                <h1 id="take-title"></h1>
                <p class="page-subtitle" hidden id="take-desc"></p>
            </header>

            <form class="survey-form" id="take-form" novalidate>
                <div id="take-fields"></div>
                <p class="empty-state" hidden id="take-empty">This survey has no questions yet.</p>
                <button class="btn btn--primary" id="take-submit-btn" type="submit">Submit response</button>
            </form>

            <section class="success-panel" hidden id="success-panel">
                <h2>Thanks for your response!</h2>
                <p>Your answers have been recorded on this device.</p>
                <button class="btn btn--ghost" id="submit-another-btn" type="button">Submit another response</button>
            </section>
        </article>

        <nav aria-label="Navigate between surveys" class="survey-take-nav">
            <a class="btn btn--ghost" data-nav="first" href="#">
                <img alt="" class="icon" height="18" src="assets/icons/png/chevrons-left.png" width="18">
                First
            </a>
            <a class="btn btn--ghost" data-nav="prev" href="#">
                <img alt="" class="icon" height="18" src="assets/icons/png/chevron-left.png" width="18">
                Prev
            </a>
            <span class="survey-take-position" data-nav-position></span>
            <a class="btn btn--ghost" data-nav="next" href="#">
                Next
                <img alt="" class="icon" height="18" src="assets/icons/png/chevron-right.png" width="18">
            </a>
            <a class="btn btn--ghost" data-nav="last" href="#">
                Last
                <img alt="" class="icon" height="18" src="assets/icons/png/chevrons-right.png" width="18">
            </a>
        </nav>
    </div>
</main>

<dialog class="dialog dialog--sm" id="theme-dialog">
    <div class="dialog-header">
        <h2 class="dialog-title">Settings</h2>
        <button aria-label="Close dialog" class="icon-button" data-dialog-close type="button">
            <img alt="" class="icon" height="18" src="assets/icons/png/close.png" width="18">
        </button>
    </div>
    <div class="dialog-body">
        <fieldset class="field">
            <legend class="field-label">Theme</legend>
            <div class="theme-options" id="theme-options"></div>
        </fieldset>
        <div class="form">
            <div class="field">
                <label class="field-label" for="theme-font">Font</label>
                <select class="field-control" id="theme-font">
                    <option value="'Inter', sans-serif">Inter</option>
                    <option value="'Lexend Deca', sans-serif">Lexend Deca</option>
                    <option value="'Asap', sans-serif">Asap</option>
                </select>
            </div>
            <div class="field">
                <label class="field-label" for="theme-font-size">Font size</label>
                <div class="range-wrap">
                    <input id="theme-font-size" max="20" min="13" step="1" type="range">
                    <output id="theme-font-size-out">16px</output>
                </div>
            </div>
            <div class="field">
                <label class="field-label" for="theme-radius">Corner radius</label>
                <div class="range-wrap">
                    <input id="theme-radius" max="24" min="0" step="1" type="range">
                    <output id="theme-radius-out">10px</output>
                </div>
            </div>
            <div class="field">
                <label class="field-label" for="theme-spacing">Spacing density</label>
                <div class="range-wrap">
                    <input id="theme-spacing" max="1.4" min="0.8" step="0.05" type="range">
                    <output id="theme-spacing-out">1x</output>
                </div>
            </div>
            <div class="dialog-actions">
                <button class="btn btn--ghost btn--sm" id="theme-reset" type="button">Reset to defaults</button>
            </div>
        </div>
    </div>
</dialog>

<div id="toast-host"></div>

<script src="assets/js/pages/surveyTake.js" type="module"></script>
</body>
</html>
