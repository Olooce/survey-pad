<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Survey Pad | Build and share surveys</title>
    <meta content="Create surveys, add questions of every type, preview them and share a link. " name="description">
    <meta content="#4f46e5" name="theme-color">
    <link href="favicon.ico" rel="icon" sizes="48x48">
    <link href="assets/favicon/favicon.svg" rel="icon" type="image/svg+xml">
    <link href="assets/favicon/favicon-32.png" rel="icon" sizes="32x32" type="image/png">
    <link href="assets/favicon/favicon-16.png" rel="icon" sizes="16x16" type="image/png">
    <link href="assets/favicon/apple-touch-icon.png" rel="apple-touch-icon">
    <link href="site.webmanifest" rel="manifest">
    <meta content="website" property="og:type">
    <meta content="Survey Pad" property="og:site_name">
    <meta content="Survey Pad | Build and share surveys" property="og:title">
    <meta content="Create surveys, add questions of  type, preview them and share a link. " property="og:description">
    <meta content="assets/og/og-image.png" property="og:image">
    <meta content="image/png" property="og:image:type">
    <meta content="1200" property="og:image:width">
    <meta content="630" property="og:image:height">
    <meta content="Survey Pad logo and tagline on a purple gradient" property="og:image:alt">
    <meta content="summary_large_image" name="twitter:card">
    <meta content="Survey Pad | Build and share surveys" name="twitter:title">
    <meta content="Create surveys, add questions of  type, preview them and share a link. " name="twitter:description">
    <meta content="assets/og/og-image.png" name="twitter:image">
    <meta content="Survey Pad logo and tagline on a purple gradient" name="twitter:image:alt">
    <link href="assets/css/index.css" rel="stylesheet">

    <script>
        try {
            var s = JSON.parse(localStorage.getItem('sp:theme'));
            var t = s && s.theme;
            if (!t) t = matchMedia('(prefers-contrast: more)').matches ? 'contrast'
                : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.dataset.theme = t;
        } catch (e) {
        }
    </script>
</head>
<body data-page="surveys">
<header class="app-header">
    <a class="app-brand" href="index.html">
        <span class="brand-dot"></span>
        Survey Pad
    </a>
    <button aria-label="Theming" class="icon-button" id="theme-btn" type="button">
        <img alt="" class="icon" height="18" src="assets/icons/png/settings.png" width="18">
    </button>
</header>

<main class="app-main">
    <div class="page-header">
        <div>
            <h1>Surveys</h1>
            <p class="page-subtitle">Create surveys, manage questions and share a link to collect responses.</p>
        </div>
        <button class="btn btn--primary" id="new-survey-btn" type="button">
            <img alt="" class="icon" height="18" src="assets/icons/png/plus.png" width="18">
            New survey
        </button>
    </div>

    <div class="table-wrap" id="surveys-table-wrap">
        <table class="data-table" id="surveys-table">
            <thead>
            <tr>
                <th>Title</th>
                <th>Questions</th>
                <th>Responses</th>
                <th>Updated</th>
                <th aria-label="Actions"></th>
            </tr>
            </thead>
            <tbody id="surveys-tbody"></tbody>
        </table>
    </div>
    <p class="empty-state" hidden id="surveys-empty">No surveys yet. Create your first one to get started.</p>
</main>

<dialog class="dialog dialog--sm" id="survey-dialog">
    <div class="dialog-header">
        <h2 class="dialog-title" id="survey-dialog-title">New survey</h2>
        <button aria-label="Close dialog" class="icon-button" data-dialog-close type="button">
            <img alt="" class="icon" height="18" src="assets/icons/png/close.png" width="18">
        </button>
    </div>
    <div class="dialog-body">
        <form class="form" id="survey-form" novalidate>
            <input id="survey-id" type="hidden">
            <div class="field">
                <label class="field-label" for="survey-title">Title</label>
                <input id="survey-title" maxlength="120" name="title" required type="text">
            </div>
            <div class="field">
                <label class="field-label" for="survey-slug">Slug <span class="field-hint">(used in the survey link, auto-generated)</span></label>
                <input id="survey-slug" maxlength="80" name="slug" pattern="[a-z0-9-]+" required type="text">
                <p class="field-error" hidden id="survey-slug-error">That slug is already in use.</p>
            </div>
            <div class="field">
                <label class="field-label" for="survey-desc">Description</label>
                <textarea id="survey-desc" maxlength="500" name="description" rows="3"></textarea>
            </div>
            <div class="dialog-actions">
                <button class="btn btn--ghost" data-dialog-close type="button">Cancel</button>
                <button class="btn btn--primary" id="survey-submit-btn" type="submit">Create survey</button>
            </div>
        </form>
    </div>
</dialog>

<dialog class="dialog dialog--sm" id="confirm-dialog">
    <div class="dialog-header">
        <h2 class="dialog-title" id="confirm-dialog-title">Are you sure?</h2>
        <button aria-label="Close dialog" class="icon-button" data-dialog-close type="button">
            <img alt="" class="icon" height="18" src="assets/icons/png/close.png" width="18">
        </button>
    </div>
    <div class="dialog-body">
        <p class="dialog-message" id="confirm-dialog-message"></p>
        <div class="dialog-actions">
            <button class="btn btn--ghost" data-dialog-close type="button">Cancel</button>
            <button class="btn btn--danger" id="confirm-dialog-confirm" type="button">Delete</button>
        </div>
    </div>
</dialog>

<dialog class="dialog dialog--sm" id="theme-dialog">
    <div class="dialog-header">
        <h2 class="dialog-title">Settings</h2>
        <button aria-label="Close dialog" class="icon-button" data-dialog-close type="button">
            <img alt="" class="icon" height="18" src="assets/icons/png/close.png" width="18">
        </button>
    </div>
    <div class="dialog-body">
        <fieldset class="field">
            <legend class="field-label">Theme</legend>
            <div class="theme-options" id="theme-options"></div>
        </fieldset>
        <div class="form">
            <div class="field">
                <label class="field-label" for="theme-font">Font</label>
                <select class="field-control" id="theme-font">
                    <option value="'Inter', sans-serif">Inter</option>
                    <option value="'Lexend Deca', sans-serif">Lexend Deca</option>
                    <option value="'Asap', sans-serif">Asap</option>
                </select>
            </div>
            <div class="field">
                <label class="field-label" for="theme-font-size">Font size</label>
                <div class="range-wrap">
                    <input id="theme-font-size" max="20" min="13" step="1" type="range">
                    <output id="theme-font-size-out">16px</output>
                </div>
            </div>
            <div class="field">
                <label class="field-label" for="theme-radius">Corner radius</label>
                <div class="range-wrap">
                    <input id="theme-radius" max="24" min="0" step="1" type="range">
                    <output id="theme-radius-out">10px</output>
                </div>
            </div>
            <div class="field">
                <label class="field-label" for="theme-spacing">Spacing density</label>
                <div class="range-wrap">
                    <input id="theme-spacing" max="1.4" min="0.8" step="0.05" type="range">
                    <output id="theme-spacing-out">1x</output>
                </div>
            </div>
            <div class="dialog-actions">
                <button class="btn btn--ghost btn--sm" id="theme-reset" type="button">Reset to defaults</button>
            </div>
        </div>
    </div>
</dialog>

<div id="toast-host"></div>

<script src="assets/js/pages/surveys.js" type="module"></script>
</body>
</html>
